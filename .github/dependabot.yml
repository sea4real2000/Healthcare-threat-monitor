# Weekly pull requests when a dependency has a newer version, so known vulnerabilities are fixed quickly.
# Major versions of the language runtimes, the framework, the database and its client are moved by hand,
# with the code changed and tested to match: Node.js stays on its long term support line (22) with its type
# definitions, Next.js and the postgres client stay on their current major, and PostgreSQL stays on 16,
# because a new major version of PostgreSQL cannot read an existing installation's database files without a
# full export and import.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /engine
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # The backup service's image must match the database's version exactly (docker-compose.hospital.yml).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
