# Builds the appliance for each version, tests it by starting it, and attaches the downloads to the release.
# Runs when a release is published on GitHub (Releases, Draft a new release, a new tag such as v0.8.0,
# Publish release). Can also be started by hand from the Actions tab: it builds and tests, and attaches the
# downloads to an existing release when its tag is given.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the downloads to this existing release (its tag, such as 1.0). Leave empty to build and test only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  appliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          # Room on the runner's disk for the build: remove tool kits this job does not use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          sudo apt-get update -q
          sudo apt-get install -y -q debootstrap qemu-utils qemu-system-x86 ovmf gdisk mtools dosfstools e2fsprogs zstd xz-utils zip
          # The test starts the appliance with KVM, which GitHub's Linux runners allow.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: The platform's images
        run: |
          docker compose -f docker-compose.hospital.yml build
          docker pull postgres:16-alpine
          docker pull caddy:2

      - name: Build the appliance
        run: sudo KEEP_RAW=1 appliance/build.sh dist

      # Ubuntu's own Python refuses packages installed with pip, so the tests get their own.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start the virtual machine and set it up in a browser, with BIOS
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          python appliance/boot_test.py vm dist/*[0-9].raw bios

      - name: Install from the USB stick onto an empty disk, with UEFI and Secure Boot, then set it up
        run: python appliance/boot_test.py usb dist/*-usb.raw uefi

      - name: Check the downloads
        run: |
          cd dist && sudo rm -f *.raw && sha256sum -c SHA256SUMS
          tar -tf *.ova
          unzip -l *-hyperv.zip
          xz -t *-usb.img.xz

      - name: Keep the downloads with this run
        uses: actions/upload-artifact@v4
        with:
          name: appliance
          path: dist/
          retention-days: 14

      - name: Attach the downloads to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TAG" dist/* --clobber
