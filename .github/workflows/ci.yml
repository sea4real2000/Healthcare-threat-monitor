name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: node ../scripts/check_copy.mjs

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint the Python code for errors and unused names
        run: pip install ruff==0.16.8 && ruff check --select E9,F . ../scripts ../appliance
      - run: python -m unittest discover -s tests -v

  database_and_end_to_end:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_SSL: disable
      INGEST_SIGNING_KEY: ci_only_signing_key_0123456789abcdef0123
      AUTH_SECRET: ci_only_auth_secret_0123456789abcdef01234
      SIEM_WEBHOOK_KEY: ci_only_siem_key_0123456789abcdef01234567
      HTM_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Create the public roles Supabase provides
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin;" \
            -c "grant usage on schema public to anon, authenticated" \
            -c "alter default privileges in schema public grant all on tables to anon, authenticated"
      - name: Apply every migration twice
        run: |
          for pass in 1 2; do
            for f in supabase/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
          done
      - name: Visitor roles can read and write nothing
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/lockdown.sql
      - name: The audit log refuses and detects tampering
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/audit_chain.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Build and start the console
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
      - name: Short evaluation, which fails if an attack is missed
        working-directory: engine
        run: |
          pip install -r requirements.txt
          export HTM_COLLECTOR_SECRET=$(cd ../web && npm run --silent collector:key -- sim_hospital_01)
          python -m evaluate --baseline-hours 12 --phase-hours 8 --per-kind 2 --min-detection-rate 1
      - name: The audit chain is still intact after the run
        run: test "$(psql "$DATABASE_URL" -Atc 'select ok from audit_verify()')" = "t"
      - name: Detection checks on a fresh database (the learning period, and rules on Windows events)
        working-directory: engine
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database detection_checks"
          export DATABASE_URL=postgres://postgres:postgres@localhost:5432/detection_checks
          for f in ../supabase/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
          python -m db_checks.windows_rules
          python -m db_checks.learning_period
      - name: The lockdown test fails when a hole is opened
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "grant select on sources to anon; create policy leak on sources for select to anon using (true);"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/lockdown.sql; then
            echo "The lockdown test passed with a hole open. The test is broken."; exit 1
          fi

  one_command_demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the demo from nothing and catch an attack
        run: sh scripts/demo_smoke.sh
      - name: Stop the demo
        if: always()
        run: docker compose down --volumes

  hospital_install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start a hospital installation from nothing, over HTTPS, and check it is locked down
        run: sh scripts/hospital_smoke.sh
      - name: Stop the installation
        if: always()
        run: docker compose -f docker-compose.hospital.yml down --volumes

  appliance_scripts:
    # The appliance's own scripts. The full appliance is built and started in release.yml for each version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the appliance scripts
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck libxml2-utils
          shellcheck -S warning appliance/build.sh appliance/files/bin/*
          python3 -m py_compile appliance/boot_test.py
          xmllint --noout appliance/files/appliance.ovf

  windows_collector:
    # The Windows collector on a real Windows computer: its C# core under test, then the real installer,
    # scheduled task, audit policy and event log, sending to a local stand in that checks every signature.
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      CI_SECRET: ci_only_windows_secret_0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: The collector core's tests
        run: dotnet run --project web/collectors/windows/tests/CollectorTests.csproj -- unit
      - name: Install the collector as an administrator would
        run: |
          $kit = Join-Path $env:RUNNER_TEMP 'kit'
          New-Item -ItemType Directory -Path $kit | Out-Null
          Copy-Item web/collectors/windows/*.ps1, web/collectors/windows/*.cs $kit
          @{ api_url = 'http://127.0.0.1:8765'; collector_id = 'win_ci00000001'; secret = $env:CI_SECRET; root_certificate = $null; interval_minutes = 1 } |
            ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $kit 'config.json')
          & (Join-Path $kit 'install.ps1') -NoTest
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed with $LASTEXITCODE" }
      - name: Make events, run the scheduled task, and check what arrived
        run: |
          trap {
            # Shown as an annotation on the commit, so the reason is visible without opening the log.
            $log = Join-Path $env:ProgramData 'HealthcareThreatMonitor\collector.log'
            $tail = if (Test-Path $log) { (Get-Content $log -Tail 5) -join ' | ' } else { 'no collector.log' }
            Write-Host "::error title=Windows collector check::$($_.Exception.Message) Collector log: $tail"
            exit 1
          }
          & ./scripts/windows_ci_start_receiver.ps1 -Secret $env:CI_SECRET -Output (Join-Path $env:RUNNER_TEMP 'received.jsonl')
          # A failed sign in, and a process with a command line the platform should see.
          Add-Type -Namespace Ci -Name Logon -MemberDefinition '[DllImport("advapi32.dll", SetLastError = true)] public static extern bool LogonUser(string user, string domain, string password, int type, int provider, out IntPtr token);'
          $token = [IntPtr]::Zero
          if ([Ci.Logon]::LogonUser('htmcinobody', '.', 'Wrong pass 1!', 3, 0, [ref]$token)) { throw 'The made up account signed in' }
          cmd.exe /c "echo htm-ci-marker > nul"
          Start-Sleep -Seconds 2
          $task = 'Healthcare Threat Monitor collector'
          Start-ScheduledTask -TaskName $task
          $deadline = (Get-Date).AddMinutes(4)
          do { Start-Sleep -Seconds 3; $state = (Get-ScheduledTask -TaskName $task).State } while ($state -ne 'Ready' -and (Get-Date) -lt $deadline)
          Start-Sleep -Seconds 3
          $dir = Join-Path $env:ProgramData 'HealthcareThreatMonitor'
          Get-Content (Join-Path $dir 'collector.log')
          $info = Get-ScheduledTaskInfo -TaskName $task
          if ($info.LastTaskResult -ne 0) { throw "The scheduled task ended with $($info.LastTaskResult)" }
          $records = Get-Content (Join-Path $env:RUNNER_TEMP 'received.jsonl') | ForEach-Object { $_ | ConvertFrom-Json }
          Write-Host "records received: $($records.Count)"
          $process = @($records | Where-Object { $_.payload.EventID -eq 4688 -and $_.payload.Data.CommandLine -like '*htm-ci-marker*' })
          if ($process.Count -eq 0) { throw 'No process creation event with its command line arrived' }
          $failed = @($records | Where-Object { $_.payload.EventID -eq 4625 -and $_.payload.Data.TargetUserName -eq 'htmcinobody' })
          if ($failed.Count -eq 0) { throw 'No failed sign in event arrived' }
          if (@($records | Where-Object { $_.payload.Data.PSObject.Properties.Name -contains 'TargetUserSid' }).Count -gt 0) { throw 'A field the platform does not read left the computer' }
          if (-not (Test-Path (Join-Path $dir 'state.json'))) { throw 'The position in the logs was not saved' }
          $principal = (Get-ScheduledTask -TaskName $task).Principal.UserId
          if ($principal -notin @('SYSTEM', 'S-1-5-18', 'NT AUTHORITY\SYSTEM')) { throw "The task runs as $principal, not SYSTEM" }
          $acl = (Get-Acl $dir).Access | ForEach-Object { $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value }
          if (@($acl | Where-Object { $_ -notin @('S-1-5-18', 'S-1-5-32-544') }).Count -gt 0) { throw "The collector folder is open to more than SYSTEM and administrators: $acl" }
          Write-Host 'PASS: the collector ran as SYSTEM and sent signed Windows events, with only the fields the platform reads'
          exit 0
      - name: A wrong secret is refused and explained
        run: |
          trap { Write-Host "::error title=Windows wrong secret check::$($_.Exception.Message)"; exit 1 }
          & ./scripts/windows_ci_start_receiver.ps1 -Secret $env:CI_SECRET -Output (Join-Path $env:RUNNER_TEMP 'received.jsonl')
          $dir = Join-Path $env:ProgramData 'HealthcareThreatMonitor'
          $config = Get-Content -Raw (Join-Path $dir 'config.json') | ConvertFrom-Json
          $config.secret = 'not the right secret'
          $config | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $dir 'config.json')
          cmd.exe /c "echo htm-ci-second-marker > nul"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'htm-collector.ps1')
          if ($LASTEXITCODE -eq 0) { throw 'The collector did not fail with a wrong secret' }
          if (-not (Select-String -Path (Join-Path $dir 'collector.log') -Pattern 'secret in config.json was refused' -Quiet)) { throw 'The refusal was not explained' }
          Write-Host 'PASS: a wrong secret is refused and explained'
          exit 0
      - name: Uninstall
        run: |
          & (Join-Path $env:ProgramData 'HealthcareThreatMonitor\uninstall.ps1')
          Start-Sleep -Seconds 6
          if (Get-ScheduledTask -TaskName 'Healthcare Threat Monitor collector' -ErrorAction SilentlyContinue) { throw 'The task is still there' }
          if (Test-Path (Join-Path $env:ProgramData 'HealthcareThreatMonitor')) { throw 'The folder is still there' }
          Write-Host 'PASS: uninstalled'
      - name: Show the logs
        if: always()
        run: |
          Get-Content (Join-Path $env:ProgramData 'HealthcareThreatMonitor\collector.log') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:RUNNER_TEMP 'rx.log') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:RUNNER_TEMP 'rx.err.log') -ErrorAction SilentlyContinue
